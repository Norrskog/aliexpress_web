title: AliExpress

chapters:
  - index.md
  
preprocessors:
  - superlinks
  - anchors
  - customids:
      targets:
          - mkdocs
          - site
          
backend_config:
  mkdocs:
    mkdocs_path: mkdocs
    slug: aliexpress  
    use_title: true
    use_chapters: true
    use_headings: true
    default_subsection_title: Expand
    mkdocs.yml:
      theme:
        name: material
        logo: assets/logo.svg
        favicon: assets/favicon.png
      site_name: AliExpress
#      site_url: https://norrskog.gitlab.io/aliexpress
      extra_css:
        - stylesheets/extra.css
